[thresholds]
offline_threshold_days = 2
long_term_fault_days = 30
high_priority_days = 7
border_radius_km = 20

[filters]
ignore_demo_vehicles = true

[mix_api]
org_ids = 
poll_interval_minutes = 5
inter_org_delay_seconds = 5

[teletrac_api]
client_ids = 
poll_interval_minutes = 5
inter_client_delay_seconds = 5

[ft_cloud_api]
fleet_ids = 
poll_interval_minutes = 5
inter_call_delay_seconds = 0.2
position_source = webhook
position_lookback_days = 3
webhook_position_max_age_minutes = 1440

[digests]
weekly_send_day = monday
weekly_send_time = 08:00
weekly_send_window_hours = 6
pending_confirmation_overdue_days = 2
send_pending_digest = true
send_escalation_digest = true
send_known_issues_checkin = true
send_tamper_report = true
pending_digest_interval_days = 7
escalation_digest_interval_days = 7
known_issues_checkin_interval_days = 7
tamper_report_interval_days = 7

[recovery]
requires_comment = true
suppress_when_reconnect_check_sent = true

