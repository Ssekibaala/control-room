<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GTL Fleet Intelligence - Sign In</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg:#05050A; --card-bg:#161622; --card-bg-2:#1C1C2C; --border:rgba(255,255,255,0.10);
    --text-primary:#FAFAFC; --text-secondary:rgba(250,250,252,0.62); --text-tertiary:rgba(250,250,252,0.42);
    --primary:#2E8CFF; --primary-2:#7B61FF; --danger:#FF5C7A;
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    background: var(--bg); color:var(--text-primary); font-family:-apple-system,BlinkMacSystemFont,'Inter',sans-serif;
    min-height:100vh; display:flex; align-items:center; justify-content:center;
    background-image: radial-gradient(circle at 12% -8%, rgba(46,140,255,0.22), transparent 42%),
                       radial-gradient(circle at 92% 4%, rgba(197,99,255,0.18), transparent 40%);
    background-attachment:fixed;
  }
  .card {
    background: linear-gradient(160deg, var(--card-bg-2), var(--card-bg));
    border:1px solid var(--border); border-radius:20px; padding:40px 36px; width:360px;
    box-shadow: 0 24px 60px rgba(0,0,0,0.5);
  }
  .brand { display:flex; align-items:center; gap:12px; margin-bottom:28px; }
  .brand-mark { width:40px; height:40px; border-radius:11px; background:linear-gradient(135deg,var(--primary),var(--primary-2));
    color:#fff; display:flex; align-items:center; justify-content:center; font-family:'JetBrains Mono'; font-weight:700; font-size:12px; }
  .brand-text .name { font-weight:700; font-size:15px; }
  .brand-text .sub { font-size:11.5px; color:var(--text-tertiary); }
  h1 { font-size:19px; font-weight:700; margin-bottom:6px; }
  .subtitle { font-size:13px; color:var(--text-secondary); margin-bottom:26px; }
  label { display:block; font-size:12px; color:var(--text-secondary); margin-bottom:6px; font-weight:600; }
  input {
    width:100%; background:rgba(255,255,255,0.05); border:1px solid var(--border); color:var(--text-primary);
    padding:11px 14px; border-radius:10px; font-size:14px; margin-bottom:18px;
  }
  input:focus { outline:none; border-color:var(--primary); }
  button {
    width:100%; background:linear-gradient(135deg,var(--primary),var(--primary-2)); border:none; color:#fff;
    padding:12px; border-radius:10px; font-size:14px; font-weight:700; cursor:pointer;
    box-shadow: 0 4px 14px rgba(46,140,255,0.3);
  }
  button:hover { filter:brightness(1.06); }
  button:disabled { opacity:0.6; cursor:default; }
  .error { color:var(--danger); font-size:12.5px; margin-top:14px; min-height:16px; }
</style>
</head>
<body>

<form class="card" id="login-form">
  <div class="brand">
    <div class="brand-mark">GTL</div>
    <div class="brand-text">
      <div class="name">Fleet Intelligence</div>
      <div class="sub">Command Centre</div>
    </div>
  </div>
  <h1>Sign in</h1>
  <div class="subtitle">Globe Trotters Ltd &middot; Cross-Platform Integrity Monitor</div>

  <label for="username">Username</label>
  <input type="text" id="username" autocomplete="username" required>

  <label for="password">Password</label>
  <input type="password" id="password" autocomplete="current-password" required>

  <button type="submit" id="submit-btn">Sign in</button>
  <div class="error" id="error-msg"></div>
</form>

<script>
document.getElementById('login-form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const btn = document.getElementById('submit-btn');
  const errEl = document.getElementById('error-msg');
  errEl.textContent = '';
  btn.disabled = true;
  btn.textContent = 'Signing in...';

  try {
    const resp = await fetch('/api/login', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({
        username: document.getElementById('username').value,
        password: document.getElementById('password').value,
      }),
    });
    if (resp.ok) {
      window.location.href = '/';
    } else {
      const body = await resp.json();
      errEl.textContent = body.error || 'Sign in failed.';
      btn.disabled = false;
      btn.textContent = 'Sign in';
    }
  } catch (err) {
    errEl.textContent = 'Could not reach the server. Try again.';
    btn.disabled = false;
    btn.textContent = 'Sign in';
  }
});
</script>

</body>
</html>
