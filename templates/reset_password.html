<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fleet Intelligence - Reset Password</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script>
  // Same palette as login.html - sampled from the real logo file, see
  // that template's comment for the source pixels.
  tailwind.config = {
    theme: {
      extend: {
        colors: {
          'brand-navy': '#1F3366',
          'brand-navy-deep': '#0E1B3A',
          'brand-green': '#76C25F',
          'brand-green-dark': '#5CA648',
          base: '#0B1220',
          surface: '#131C2B',
          line: '#1F2A3C',
          muted: '#8A97AB',
          ink: '#E8EDF5',
          danger: '#FF6B7F',
        },
        fontFamily: { display: ['Manrope', 'ui-sans-serif', 'system-ui', 'sans-serif'] },
        keyframes: {
          fadeSlideIn: { from: { opacity: 0, transform: 'translateY(10px)' }, to: { opacity: 1, transform: 'translateY(0)' } },
          spin: { to: { transform: 'rotate(360deg)' } },
        },
        animation: {
          fadeSlideIn: 'fadeSlideIn 0.5s cubic-bezier(.16,1,.3,1) both',
          spin: 'spin 0.7s linear infinite',
        },
      },
    },
  };
</script>
<style>
  html, body { height: 100%; }
  body { font-family: 'Manrope', ui-sans-serif, system-ui, sans-serif; }
  input[type="checkbox"] { accent-color: #76C25F; }
  @media (prefers-reduced-motion: reduce) {
    .animate-fadeSlideIn, .animate-spin { animation: none !important; }
  }
</style>
</head>
<body class="min-h-screen flex items-center justify-center bg-base text-ink antialiased px-6 py-10">

<div class="w-full max-w-[400px] animate-fadeSlideIn">

  <div class="flex justify-center mb-8">
    <div class="inline-flex items-center gap-3 bg-white rounded-xl pl-2.5 pr-4 py-2 shadow-lg shadow-black/25 w-fit">
      <img src="{{ url_for('static', filename='Teletrac_Fleet_Solutions_logo.png') }}" alt="Teletrac Fleet Solutions" class="h-7 w-auto block">
    </div>
  </div>

  {% if token_error %}
  <!-- ============ INVALID / EXPIRED TOKEN ============ -->
  <div class="text-center">
    <div class="mx-auto mb-4 w-11 h-11 rounded-full bg-danger/10 border border-danger/25 flex items-center justify-center">
      <svg viewBox="0 0 24 24" class="w-5 h-5 text-danger" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M12 8v5M12 16h.01"/></svg>
    </div>
    <h1 class="font-display text-xl font-bold tracking-tight mb-2">Link no longer works</h1>
    <p class="text-[13px] text-muted leading-relaxed mb-7">{{ token_error }}</p>
    <a href="/login" class="inline-flex w-full items-center justify-center h-12 rounded-lg bg-brand-green text-brand-navy-deep font-bold text-sm
       shadow-[0_6px_18px_rgba(118,194,95,0.28)] transition-all duration-150 hover:bg-brand-green-dark">
      Back to sign in
    </a>
  </div>

  {% else %}
  <!-- ============ SET NEW PASSWORD ============ -->
  <div id="form-state">
    <h1 class="font-display text-2xl font-bold tracking-tight mb-1.5 text-center">Choose a new password</h1>
    <p class="text-[13px] text-muted mb-8 text-center leading-relaxed">Pick something you haven't used before. At least 8 characters.</p>

    <form id="reset-form" novalidate>
      <div class="mb-4">
        <label for="new-password" class="block text-xs font-semibold text-muted mb-1.5">New password</label>
        <div class="relative flex items-center">
          <svg viewBox="0 0 24 24" class="absolute left-3.5 w-[15px] h-[15px] stroke-muted fill-none pointer-events-none" stroke-width="1.8"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
          <input type="password" id="new-password" autocomplete="new-password" minlength="8" required
            class="w-full h-12 bg-surface border border-line text-ink placeholder:text-muted/60 rounded-lg pl-10 pr-11 text-sm
                   transition-colors duration-150 outline-none hover:border-muted/50
                   focus:border-brand-green focus:ring-4 focus:ring-brand-green/15">
          <button type="button" id="toggle-pw1" tabindex="-1" aria-label="Show password"
            class="absolute right-2.5 w-7 h-7 flex items-center justify-center rounded-md text-muted hover:text-ink hover:bg-white/5 transition-colors duration-150">
            <svg viewBox="0 0 24 24" class="w-[15px] h-[15px]" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7z"/><circle cx="12" cy="12" r="3"/></svg>
          </button>
        </div>
      </div>

      <div class="mb-2">
        <label for="confirm-password" class="block text-xs font-semibold text-muted mb-1.5">Confirm password</label>
        <div class="relative flex items-center">
          <svg viewBox="0 0 24 24" class="absolute left-3.5 w-[15px] h-[15px] stroke-muted fill-none pointer-events-none" stroke-width="1.8"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
          <input type="password" id="confirm-password" autocomplete="new-password" minlength="8" required
            aria-describedby="reset-error"
            class="w-full h-12 bg-surface border border-line text-ink placeholder:text-muted/60 rounded-lg pl-10 pr-11 text-sm
                   transition-colors duration-150 outline-none hover:border-muted/50
                   focus:border-brand-green focus:ring-4 focus:ring-brand-green/15
                   aria-[invalid=true]:border-danger aria-[invalid=true]:ring-4 aria-[invalid=true]:ring-danger/15">
          <button type="button" id="toggle-pw2" tabindex="-1" aria-label="Show password"
            class="absolute right-2.5 w-7 h-7 flex items-center justify-center rounded-md text-muted hover:text-ink hover:bg-white/5 transition-colors duration-150">
            <svg viewBox="0 0 24 24" class="w-[15px] h-[15px]" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7z"/><circle cx="12" cy="12" r="3"/></svg>
          </button>
        </div>
      </div>

      <input type="hidden" id="reset-token" value="{{ token }}">

      <button type="submit" id="reset-submit-btn"
        class="w-full mt-5 h-12 rounded-lg bg-brand-green text-brand-navy-deep font-bold text-sm
               shadow-[0_6px_18px_rgba(118,194,95,0.28)] transition-all duration-150
               hover:bg-brand-green-dark hover:-translate-y-px active:translate-y-0 active:scale-[0.99]
               disabled:opacity-60 disabled:cursor-default disabled:translate-y-0
               flex items-center justify-center gap-2">
        <svg id="reset-spinner" class="hidden w-4 h-4 animate-spin" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="9" stroke="currentColor" stroke-width="3" opacity="0.3"/><path d="M21 12a9 9 0 0 0-9-9" stroke="currentColor" stroke-width="3" stroke-linecap="round"/></svg>
        <span id="reset-submit-label">Update password</span>
      </button>

      <div id="reset-error" class="hidden items-center gap-1.5 mt-3.5 text-[12.5px] text-danger" role="alert"></div>
    </form>
  </div>
  {% endif %}
</div>

<script>
(function () {
  const form = document.getElementById('reset-form');
  if (!form) return; // invalid/expired-token state has no form

  function wireToggle(btnId, inputId) {
    const btn = document.getElementById(btnId);
    const input = document.getElementById(inputId);
    btn.addEventListener('click', () => {
      const show = input.type === 'password';
      input.type = show ? 'text' : 'password';
      btn.setAttribute('aria-label', show ? 'Hide password' : 'Show password');
    });
  }
  wireToggle('toggle-pw1', 'new-password');
  wireToggle('toggle-pw2', 'confirm-password');

  function showError(msg) {
    const el = document.getElementById('reset-error');
    el.textContent = msg;
    el.classList.toggle('hidden', !msg);
    el.classList.toggle('flex', !!msg);
    document.getElementById('confirm-password').setAttribute('aria-invalid', msg ? 'true' : 'false');
  }

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    const pw = document.getElementById('new-password').value;
    const confirm = document.getElementById('confirm-password').value;
    showError('');

    if (pw.length < 8) { showError('Password must be at least 8 characters.'); return; }
    if (pw !== confirm) { showError('Passwords do not match.'); return; }

    const btn = document.getElementById('reset-submit-btn');
    const spinner = document.getElementById('reset-spinner');
    const label = document.getElementById('reset-submit-label');
    btn.disabled = true;
    spinner.classList.remove('hidden');
    label.textContent = 'Updating...';

    try {
      const resp = await fetch('/api/password/reset', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ token: document.getElementById('reset-token').value, password: pw }),
      });
      const body = await resp.json().catch(() => ({}));
      if (resp.ok) {
        window.location.href = '/login?reset=success';
        return;
      }
      showError(body.error || 'Could not update your password.');
    } catch (err) {
      showError('Could not reach the server. Try again.');
    }
    btn.disabled = false;
    spinner.classList.add('hidden');
    label.textContent = 'Update password';
  });
})();
</script>

</body>
</html>
